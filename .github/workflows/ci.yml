name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  e2e:
    name: End-to-end (full stack)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Start the legacy stack
        run: docker compose up -d --build
      - name: Run end-to-end test
        run: ./scripts/e2e.sh http://localhost
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100
      - name: Surface errors as annotations
        if: failure()
        run: |
          docker compose ps --format '{{.Service}}: {{.State}} {{.Health}}' | while read -r line; do echo "::warning title=Service::$line"; done
          docker compose logs --no-color web worker nginx \
            | grep -iE "error|exception|denied|refused|traceback" | tail -8 \
            | while read -r line; do echo "::error title=Log::${line:0:300}"; done
      - name: Stop the stack
        if: always()
        run: docker compose down -v

    terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false && terraform validate
      - name: Validate main environment
        working-directory: infra
        run: terraform init -backend=false && terraform validate