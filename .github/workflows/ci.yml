name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  e2e:
    name: End-to-end (full stack)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Start the legacy stack
        run: docker compose up -d --build
      - name: Run end-to-end test
        run: ./scripts/e2e.sh http://localhost
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
