<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DocFlow converts Word, Excel, PowerPoint, text and image files to PDF and merges PDFs.">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="frame-bar">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 2.5h8.5L19 7v14.5H6z"/><path d="M14.5 2.5V7H19"/></svg>
      </span>
      {{ app_name }}
    </a>
    {% if user %}
      <div class="account">
        <span class="account-email">{{ user.email }}</span>
        <form method="post" action="/logout"><button class="btn btn-outline btn-sm">Log out</button></form>
      </div>
    {% endif %}
  </header>
  <main id="main" class="sheet {% block sheet_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
