<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f0">
  <meta name="description" content="DocFlow converts Word, Excel, PowerPoint, text and image files to PDF and merges PDFs.">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="frame-bar">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h6.5L15 6.5c2.8 1.4 4.5 3.4 4.5 5.5 0 5-4 9-9 9H5z"/><path d="M11.5 3v3.5H15"/><path d="M8 13c1.3-1.6 2.7-1.6 4 0s2.7 1.6 4 0"/></svg>
      </span>
      {{ app_name }}
    </a>
    {% if user %}
      <div class="account">
        <span class="account-email" title="{{ user.email }}">{{ user.email }}</span>
        <form method="post" action="/logout"><button class="btn btn-secondary btn-sm">Log out</button></form>
      </div>
    {% endif %}
  </header>
  <main id="main" class="sheet {% block sheet_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block after %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
