server {
    listen 80;
    server_name _;

    # Must be a bit larger than MAX_UPLOAD_MB in .env (merges send several files).
    client_max_body_size 100m;
    proxy_read_timeout 120s;

    # Look up the web container's address through Docker's internal DNS and
    # re-check it every 10 seconds. With a fixed "proxy_pass http://web:8000",
    # nginx resolves the name only once at start-up, so after the web
    # container is rebuilt it keeps sending traffic to the old, dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:8000;

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
